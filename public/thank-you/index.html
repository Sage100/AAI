<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | Anabaptist Aid Initiative</title><meta name="description" content="Thank you for contacting Anabaptist Aid Initiative." />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="thank-you">
  <header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <span class="badge" aria-hidden="true">AAI</span>
      <span class="txt">Anabaptist Aid Initiative</span>
    </a>
    <button id="nav" class="menu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Menu ▾</button>
    <nav id="menu" aria-label="Primary">
      <a data-page="home" href="/" class="">Home</a>
      <a data-page="videos" href="/videos/" class="">Videos</a>
      <a data-page="salt-program" href="/salt-program/" class="">SALT Program</a>
      <a data-page="contact" href="/#contact" class="btn secondary">Contact</a>
      <a data-page="donate" href="https://www.saltnigeria.org/donate" target="_blank" rel="noopener" class="btn">Donate</a>
      
    </nav>
  </div>
</header>
<script>
  (function() {
    const navBtn = document.getElementById('nav');
    const nav = document.getElementById('menu');
    const mobileBreakpoint = 980;

    if (!navBtn || !nav) return;

    const closeNav = () => {
      navBtn.classList.remove('open');
      navBtn.setAttribute('aria-expanded', 'false');
      nav.classList.remove('open');
    };

    navBtn.addEventListener('click', () => {
      navBtn.classList.toggle('open');
      const expanded = navBtn.getAttribute('aria-expanded') === 'true';
      navBtn.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('open');
    });

    document.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof Node)) return;
      if (!nav.contains(target) && !navBtn.contains(target)) {
        closeNav();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > mobileBreakpoint) {
        closeNav();
      }
    });
  })();
</script>

  <main id="main">
    
  <section class="thank-you-section">
    <div class="wrap">
      <div class="thank-you-panel">
        <p class="eyebrow">Message received</p>
        <h1>Thank you</h1>
        <p class="lead">Thank you! We will reply to your message soon.</p>
        <p><a class="btn chip" href="/#contact">Back to contact</a></p>
      </div>
    </div>
  </section>

  </main>
  <footer role="contentinfo">
  <div class="wrap">
    <div class="footer-grid">
      <div class="footer-brand">
        <b>Anabaptist Aid Initiative</b>
        <p>Local coordination for SALT program work in Nigeria.</p>
      </div>
      <div class="foot-actions">
        <a class="btn chip" href="https://www.saltnigeria.org/donate" target="_blank" rel="noopener">Donate</a>
        <a class="btn chip" href="/#contact">Contact Us</a>
      </div>
    </div>
    <p class="small">
      © 2026 Anabaptist Aid Initiative.
    </p>
  </div>
</footer>

</body>
</html>
